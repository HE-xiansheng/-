api: false
authInternalUsers:
- ips:
  - 127.0.0.1
  permissions:
  - action: publish
    path: upstream
  - action: read
    path: upstream
  user: any
authMethod: internal
hls: false
logDestinations:
- stdout
logLevel: info
metrics: false
moq: false
paths:
  upstream:
    source: publisher
playback: false
pprof: false
readTimeout: 5s
rtcpAddress: 127.0.0.1:18001
rtmp: false
rtpAddress: 127.0.0.1:18000
rtsp: true
rtspAddress: 127.0.0.1:18555
rtspTransports:
- tcp
srt: false
udpMaxPayloadSize: 1200
webrtc: false
writeQueueSize: 256
writeTimeout: 5s
