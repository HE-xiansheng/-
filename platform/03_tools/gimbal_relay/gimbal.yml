# Native H264 relay. No decode, encode, ROS image conversion or recording.
logLevel: info
logDestinations: [stdout]
readTimeout: 5s
writeTimeout: 5s
writeQueueSize: 256
udpMaxPayloadSize: 1200
api: false
metrics: false
pprof: false
playback: false
rtmp: false
hls: false
webrtc: false
srt: false
moq: false
rtsp: true
rtspAddress: :8554
rtspTransports: [udp, tcp]
rtpAddress: :8000
rtcpAddress: :8001
authMethod: internal
authInternalUsers:
  - user: any
    ips: [127.0.0.1, '::1', 192.168.0.0/23, 100.64.0.0/10]
    permissions:
      - action: read
        path: gimbal
paths:
  gimbal:
    source: rtsp://192.168.144.108:554
    sourceOnDemand: false
    rtspTransport: tcp
